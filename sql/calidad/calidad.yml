version: 2

models:
  - name: int_calidad
    description: >
      Cada viaje del staging con las reglas que viola: reglas_rechazo (severidad rechazo) y
      flags (advertencias). Los umbrales y las severidades salen de reglas_calidad.
    columns:
      - name: trip_id
        data_tests:
          - unique
          - not_null
      - name: reglas_rechazo
        description: Ids de las reglas de rechazo que viola, en orden y separados por comas; vacío si no viola ninguna.
        data_tests:
          - not_null
      - name: flags
        description: Ids de las advertencias que cumple, en orden y separados por comas; vacío si no cumple ninguna.
        data_tests:
          - not_null

  - name: trips_aceptados
    description: Viajes sin reglas de rechazo; las advertencias quedan en flags.

  - name: trips_cuarentena
    description: >
      Viajes con al menos una regla de rechazo: la fila del staging, source_file y las reglas
      violadas.
    columns:
      - name: trip_id
        data_tests:
          - unique
          - not_null

  - name: reporte_calidad_mes
    description: >
      Por mes: filas leídas (de la tabla cruda), aceptadas, en cuarentena y la diferencia, que
      tiene que ser 0 (lo controla el test tests/dbt/reconciliacion_conteos.sql).
    columns:
      - name: mes
        data_tests:
          - unique
          - not_null

  - name: reporte_calidad_reglas
    description: Filas por regla y por mes, con todas las reglas del catálogo aunque no tengan casos.

unit_tests:
  # Datos sintéticos, justo a cada lado de los umbrales de las dos reglas propias.
  - name: reglas_propias_en_el_borde
    model: int_calidad
    given:
      - input: ref('stg_yellow_trips')
        rows:
          # R16: 10 mi en 7,5 min son 80 mph exactos (no supera el umbral); 10,01 mi sí.
          - {trip_id: a, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:07:30",
             trip_distance: 10.00, fare_amount: 30, total_amount: 35, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          - {trip_id: b, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:07:30",
             trip_distance: 10.01, fare_amount: 30, total_amount: 35, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          # R17: 361 min con tarifa 0,35 × 361 = 126,35 cumple; un centavo menos no.
          - {trip_id: c, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 16:01:00",
             trip_distance: 20, fare_amount: 126.35, total_amount: 130, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          - {trip_id: d, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 16:01:00",
             trip_distance: 20, fare_amount: 126.34, total_amount: 130, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          # R17: 360 min exactos no superan la duración máxima, aunque la tarifa sea baja.
          - {trip_id: e, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 16:00:00",
             trip_distance: 20, fare_amount: 1, total_amount: 5, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          # R18: 59 s queda marcado como advertencia; 60 s exactos no.
          - {trip_id: f, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:00:59",
             trip_distance: 0.1, fare_amount: 3, total_amount: 5, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          - {trip_id: g, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:01:00",
             trip_distance: 0.1, fare_amount: 3, total_amount: 5, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
      - input: ref('stg_taxi_zones')
        rows:
          - {location_id: 100}
      - input: ref('reglas_calidad')
        rows:
          - {id: R16, severidad: rechazo, umbral: 80}
          - {id: R17, severidad: rechazo, umbral: 360, umbral_2: 0.35}
          - {id: R18, severidad: advertencia, umbral: 60}
    expect:
      rows:
        - {trip_id: a, reglas_rechazo: "", flags: ""}
        - {trip_id: b, reglas_rechazo: R16, flags: ""}
        - {trip_id: c, reglas_rechazo: "", flags: ""}
        - {trip_id: d, reglas_rechazo: R17, flags: ""}
        - {trip_id: e, reglas_rechazo: "", flags: ""}
        - {trip_id: f, reglas_rechazo: "", flags: R18}
        - {trip_id: g, reglas_rechazo: "", flags: ""}

  # La severidad sale del catálogo: con R16 como advertencia, el mismo viaje pasa a flags.
  - name: severidad_se_lee_del_catalogo
    model: int_calidad
    given:
      - input: ref('stg_yellow_trips')
        rows:
          - {trip_id: b, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:07:30",
             trip_distance: 10.01, fare_amount: 30, total_amount: 35, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
      - input: ref('stg_taxi_zones')
        rows:
          - {location_id: 100}
      - input: ref('reglas_calidad')
        rows:
          - {id: R16, severidad: advertencia, umbral: 80}
    expect:
      rows:
        - {trip_id: b, reglas_rechazo: "", flags: R16}

  # R19: tarifa negativa con total positivo es advertencia; con total en 0 no aplica y con
  # total negativo el viaje lo rechaza R06 (sin R19). La tarifa en 0 no es negativa.
  - name: r19_tarifa_negativa_con_total_positivo
    model: int_calidad
    given:
      - input: ref('stg_yellow_trips')
        rows:
          - {trip_id: h, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: -1, total_amount: 5, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 0, ratecode_id: 1}
          - {trip_id: i, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: 0, total_amount: 5, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 0, ratecode_id: 1}
          - {trip_id: j, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: -1, total_amount: 0, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 0, ratecode_id: 1}
          - {trip_id: k, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: -1, total_amount: -5, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 0, ratecode_id: 1}
      - input: ref('stg_taxi_zones')
        rows:
          - {location_id: 100}
      - input: ref('reglas_calidad')
        rows:
          - {id: R06, severidad: rechazo}
          - {id: R19, severidad: advertencia, umbral: 0}
    expect:
      rows:
        - {trip_id: h, reglas_rechazo: "", flags: R19}
        - {trip_id: i, reglas_rechazo: "", flags: ""}
        - {trip_id: j, reglas_rechazo: "", flags: ""}
        - {trip_id: k, reglas_rechazo: R06, flags: ""}

  # R20: la fila positiva con las mismas claves que un reverso y el total opuesto se rechaza.
  # Un total que difiere en un centavo o un proveedor distinto no son gemelas.
  - name: r20_gemela_de_un_reverso
    model: int_calidad
    given:
      - input: ref('stg_yellow_trips')
        rows:
          - {trip_id: l, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1, vendor_id: 2,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: 15, total_amount: 20, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          - {trip_id: m, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1, vendor_id: 2,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: -15, total_amount: -20, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          - {trip_id: n, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1, vendor_id: 2,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: 15, total_amount: 19.99, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          - {trip_id: o, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1, vendor_id: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: 15, total_amount: 20, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
      - input: ref('stg_taxi_zones')
        rows:
          - {location_id: 100}
      - input: ref('reglas_calidad')
        rows:
          - {id: R06, severidad: rechazo}
          - {id: R20, severidad: rechazo}
    expect:
      rows:
        - {trip_id: l, reglas_rechazo: R20, flags: ""}
        - {trip_id: m, reglas_rechazo: R06, flags: ""}
        - {trip_id: n, reglas_rechazo: "", flags: ""}
        - {trip_id: o, reglas_rechazo: "", flags: ""}

  # Cambio de horario: el 9/3/2025 los relojes pasaron de las 2:00 a las 3:00. De 1:50 a 3:10
  # pasaron 20 minutos, no 80; de 1:59:30 a 3:00:10, 40 segundos (R18). El día siguiente, sin
  # cambio, de 1:50 a 3:10 sí pasan 80 minutos.
  - name: duracion_con_cambio_de_horario
    model: int_calidad
    given:
      - input: ref('stg_yellow_trips')
        rows:
          - {trip_id: p, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-09 01:50:00", dropoff_at: "2025-03-09 03:10:00",
             trip_distance: 2, fare_amount: 15, total_amount: 20, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          - {trip_id: q, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-09 01:59:30", dropoff_at: "2025-03-09 03:00:10",
             trip_distance: 0.1, fare_amount: 3, total_amount: 5, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          - {trip_id: r, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 01:50:00", dropoff_at: "2025-03-10 03:10:00",
             trip_distance: 2, fare_amount: 15, total_amount: 20, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1}
      - input: ref('stg_taxi_zones')
        rows:
          - {location_id: 100}
      - input: ref('reglas_calidad')
        rows:
          - {id: R18, severidad: advertencia, umbral: 60}
    expect:
      rows:
        # extract(epoch ...) devuelve numeric con 6 decimales.
        - {trip_id: p, duracion_seg: "1200.000000", flags: ""}
        - {trip_id: q, duracion_seg: "40.000000", flags: R18}
        - {trip_id: r, duracion_seg: "4800.000000", flags: ""}

  # R10 solo mira la 264; R21, la subida en la 265 (bajar en la 265 no lleva regla); R22, la
  # tarifa fija de JFK sin JFK; R23, el cargo del CBD fuera de 0 y 0,75 (el -0,75 de un reverso
  # no cuenta: ese viaje lo rechaza R06).
  - name: reglas_de_zona_y_de_cargos
    model: int_calidad
    given:
      - input: ref('stg_yellow_trips')
        rows:
          - {trip_id: s, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: 15, total_amount: 20, passenger_count: 1,
             pu_location_id: 265, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          - {trip_id: t, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: 15, total_amount: 20, passenger_count: 1,
             pu_location_id: 100, do_location_id: 265, payment_type: 1, ratecode_id: 1}
          - {trip_id: u, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: 15, total_amount: 20, passenger_count: 1,
             pu_location_id: 264, do_location_id: 100, payment_type: 1, ratecode_id: 1}
          - {trip_id: w, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: 70, total_amount: 80, passenger_count: 1,
             pu_location_id: 100, do_location_id: 132, payment_type: 1, ratecode_id: 2}
          - {trip_id: x, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: 70, total_amount: 80, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 2}
          - {trip_id: y, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: 15, total_amount: 20, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1,
             cbd_congestion_fee: 1.25}
          - {trip_id: z, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: 15, total_amount: 20, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1,
             cbd_congestion_fee: 0.75}
          - {trip_id: aa, source_file: data/raw/yellow/year=2025/month=03/x.parquet, dup_n: 1,
             pickup_at: "2025-03-10 10:00:00", dropoff_at: "2025-03-10 10:15:00",
             trip_distance: 2, fare_amount: -15, total_amount: -20, passenger_count: 1,
             pu_location_id: 100, do_location_id: 100, payment_type: 1, ratecode_id: 1,
             cbd_congestion_fee: -0.75}
      - input: ref('stg_taxi_zones')
        rows:
          - {location_id: 100}
          - {location_id: 132}
          - {location_id: 264}
          - {location_id: 265}
      - input: ref('reglas_calidad')
        rows:
          - {id: R06, severidad: rechazo}
          - {id: R10, severidad: advertencia}
          - {id: R21, severidad: advertencia}
          - {id: R22, severidad: advertencia}
          - {id: R23, severidad: advertencia, umbral: 0.75}
    expect:
      rows:
        - {trip_id: s, reglas_rechazo: "", flags: R21}
        - {trip_id: t, reglas_rechazo: "", flags: ""}
        - {trip_id: u, reglas_rechazo: "", flags: R10}
        - {trip_id: w, reglas_rechazo: "", flags: ""}
        - {trip_id: x, reglas_rechazo: "", flags: R22}
        - {trip_id: y, reglas_rechazo: "", flags: R23}
        - {trip_id: z, reglas_rechazo: "", flags: ""}
        - {trip_id: aa, reglas_rechazo: R06, flags: ""}

  # Reconciliación sobre datos sintéticos: un mes que cuadra y otro al que le falta una fila.
  - name: reconciliacion_detecta_filas_perdidas
    model: reporte_calidad_mes
    given:
      - input: source('raw', 'yellow_trips')
        rows:
          - {source_file: data/raw/yellow/year=2025/month=03/a.parquet}
          - {source_file: data/raw/yellow/year=2025/month=03/a.parquet}
          - {source_file: data/raw/yellow/year=2025/month=03/a.parquet}
          - {source_file: data/raw/yellow/year=2024/month=03/b.parquet}
          - {source_file: data/raw/yellow/year=2024/month=03/b.parquet}
      - input: ref('trips_aceptados')
        rows:
          - {source_file: data/raw/yellow/year=2025/month=03/a.parquet}
          - {source_file: data/raw/yellow/year=2025/month=03/a.parquet}
          - {source_file: data/raw/yellow/year=2024/month=03/b.parquet}
      - input: ref('trips_cuarentena')
        rows:
          - {source_file: data/raw/yellow/year=2025/month=03/a.parquet}
    expect:
      rows:
        - {mes: "2025-03", filas_leidas: 3, filas_aceptadas: 2, filas_cuarentena: 1, diferencia: 0}
        - {mes: "2024-03", filas_leidas: 2, filas_aceptadas: 1, filas_cuarentena: 0, diferencia: 1}
