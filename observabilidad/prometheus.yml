# Métricas del pipeline: Postgres (postgres_exporter) y los contenedores (cAdvisor).
# Cada 5 s, porque una corrida dura ~20 minutos y los picos de memoria duran segundos.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: contenedores
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
